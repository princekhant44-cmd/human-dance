[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-dance"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "kirak>=0.1.1",
    "uvicorn[standard]>=0.35.0",
    "python-dotenv>=1.1.0",
]

# Not a package: without this, setuptools refuses the flat layout (hooks/, models/, ...).
[tool.setuptools]
packages = []
